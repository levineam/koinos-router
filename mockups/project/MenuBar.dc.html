<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Router menu bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14284e;text-decoration:none}a:hover{color:#14284e}
.mi:hover{background:#155eef;color:#ffffff}
button:focus-visible,a:focus-visible{outline:2px solid #155eef;outline-offset:2px;border-radius:6px}
</style>
</helmet>
<div style="position: relative; width: 680px; height: 620px; overflow: hidden; background: linear-gradient(180deg, #d7e2f2 0%, #e6edf7 100%); font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; color: #14284e; -webkit-font-smoothing: antialiased;">

  <div style="height: 30px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: rgba(248,250,253,0.82); box-shadow: 0 0.5px 0 rgba(20,40,78,0.14); font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif; font-size: 13px; color: #1b2333;">
    <span style="font-weight: 700;">Finder</span>
    <span>File</span>
    <span>Edit</span>
    <span>View</span>
    <span>Window</span>
    <span>Help</span>
    <span style="flex-grow: 1;"></span>
    <span style="width: 72px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 5px; background: rgba(20,40,78,0.12); font-variant-numeric: tabular-nums; font-weight: 500;">
      <img src="/_blob/e8305d69385acb9e447161b7a6153e39" alt="" width="16" height="16" style="display: block; filter: brightness(0); opacity: 0.88;">
      <span>42.8</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#1b2333" stroke-width="2" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0"></path><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"></path><path d="M8.7 16a5 5 0 0 1 6.6 0"></path></g><circle cx="12" cy="19.2" r="1.4" fill="#1b2333"></circle></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#1b2333" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="6" rx="3"></rect><rect x="3" y="13" width="18" height="6" rx="3"></rect></g><circle cx="7" cy="8" r="1.6" fill="#1b2333"></circle><circle cx="17" cy="16" r="1.6" fill="#1b2333"></circle></svg>
    <span style="width: 128px; text-align: right;">Wed Oct 7  1:45 PM</span>
  </div>

  <div style="position: absolute; left: 278px; top: 36px; width: 300px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: rgba(255,255,255,0.96); box-shadow: 0 0 0 0.5px rgba(20,40,78,0.16), 0 18px 48px -8px rgba(20,40,78,0.30);">

    <div style="padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 30px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">42.8</span>
        <span style="font-size: 15px; font-weight: 500; color: #64738c;">KAI</span>
      </div>
      <div style="font-size: 13px; color: #5b6b86; font-variant-numeric: tabular-nums;"><span style="color: #155eef; font-weight: 500;">+6.4 earned</span> · 2.1 spent today</div>
    </div>

    <div style="margin: 0 10px; border-top: 1px solid #edf1f7;"></div>

    <div style="padding: 6px 0;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 14px; font-weight: 500;">Share compute</div>
          <div style="font-size: 12px; color: #64738c;">{{shareStatus}}</div>
        </div>
        <button type="button" role="switch" aria-checked="{{shareAria}}" aria-label="Share compute" onClick="{{toggleShare}}" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer;">
          <span style="position: relative; display: block; width: 32px; height: 19px; border-radius: 10px; background: {{shareTrack}}; transition: background 0.2s;">
            <span style="position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(20,40,78,0.25); transform: translateX({{shareKnob}}); transition: transform 0.2s;"></span>
          </span>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 14px; font-weight: 500;">Use KoinosAI</div>
          <div style="font-size: 12px; color: #64738c;">{{useStatus}}</div>
        </div>
        <button type="button" role="switch" aria-checked="{{useAria}}" aria-label="Use KoinosAI" onClick="{{toggleUse}}" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer;">
          <span style="position: relative; display: block; width: 32px; height: 19px; border-radius: 10px; background: {{useTrack}}; transition: background 0.2s;">
            <span style="position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(20,40,78,0.25); transform: translateX({{useKnob}}); transition: transform 0.2s;"></span>
          </span>
        </button>
      </div>
    </div>

    <div style="margin: 0 10px; border-top: 1px solid #edf1f7;"></div>

    <div style="padding: 6px 0 0; display: flex; flex-direction: column;">
      <a class="mi" href="Main.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px;">Open Router</a>
      <button class="mi" type="button" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px; font-family: inherit; color: #14284e; background: none; border: 0; text-align: left; cursor: pointer;">Quit</button>
    </div>
  </div>

  <div style="position: absolute; left: 40px; bottom: 40px; display: flex; gap: 28px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 6px; background: rgba(248,250,253,0.9); box-shadow: 0 0 0 0.5px rgba(20,40,78,0.14); font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif; font-size: 13px; font-weight: 500; color: #1b2333; font-variant-numeric: tabular-nums;">
        <img src="/_blob/e8305d69385acb9e447161b7a6153e39" alt="" width="16" height="16" style="display: block; filter: brightness(0); opacity: 0.88;">
        <span>42.8</span>
      </span>
      <span style="font-size: 12px; color: #4f5f7a;">On</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 6px; background: rgba(248,250,253,0.9); box-shadow: 0 0 0 0.5px rgba(20,40,78,0.14); font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif; font-size: 13px; font-weight: 500; color: rgba(27,35,51,0.42); font-variant-numeric: tabular-nums;">
        <img src="/_blob/e8305d69385acb9e447161b7a6153e39" alt="" width="16" height="16" style="display: block; filter: brightness(0); opacity: 0.38;">
        <span>42.8</span>
      </span>
      <span style="font-size: 12px; color: #4f5f7a;">Paused</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 6px; background: rgba(248,250,253,0.9); box-shadow: 0 0 0 0.5px rgba(20,40,78,0.14); font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif; font-size: 13px; font-weight: 500; color: #1b2333; font-variant-numeric: tabular-nums;">
        <img src="/_blob/e8305d69385acb9e447161b7a6153e39" alt="" width="16" height="16" style="display: block; filter: brightness(0); opacity: 0.88;">
        <span>0.0</span>
      </span>
      <span style="font-size: 12px; color: #4f5f7a;">Out of KAI</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { share: true, use: true };
  }
  renderVals() {
    const share = this.state.share;
    const use = this.state.use;
    return {
      shareStatus: share ? 'Earning' : 'Off',
      useStatus: use ? 'Codex and Claude Code connected' : 'Off',
      shareAria: share ? 'true' : 'false',
      useAria: use ? 'true' : 'false',
      shareTrack: share ? '#155eef' : '#d6dce6',
      useTrack: use ? '#155eef' : '#d6dce6',
      shareKnob: share ? '13px' : '0px',
      useKnob: use ? '13px' : '0px',
      toggleShare: () => this.setState({ share: !share }),
      toggleUse: () => this.setState({ use: !use })
    };
  }
}
</script>
</body>
</html>
