# Koinos Router packaging (MVP_SPEC §8.1). Build from the repo root:
#   npm run dist:router
# which runs router/scripts/dist-router.js. It never builds this file as is:
# per architecture (KOINOS_ROUTER_ARCHS, default arm64) it writes a copy with
#   - extraMetadata.version = Router's own version (ROUTER_VERSION in
#     dist-router.js; Core and the full app keep package.json's version),
#   - mac.target narrowed to that architecture,
# then packs with signing off, re-signs the app (sign-router.js picks the
# identity; KOINOS_ROUTER_SIGN_IDENTITY=- is ad-hoc), notarizes it when it is
# a Developer ID build with notary credentials (notarize-router.js), and
# builds the dmg and zip from that app.
# The full Koinos AI app keeps its own config in package.json "build".

appId: io.koinosai.router
productName: Koinos Router
directories:
  output: dist-router
  buildResources: build
extraMetadata:
  main: router/main.js
  name: koinos-router
  productName: Koinos Router
# The router profile loads no native modules, so there is nothing to rebuild.
npmRebuild: false

files:
  - package.json
  - core/**
  - "!core/test/**"
  - "!core/bench/**"
  - "!core/koinos-node-template/**"
  - router/**
  - "!router/test/**"
  # Build and signing helpers run from the checkout, never inside the app.
  - "!router/scripts/**"
  - "!router/ui/dev-mock.js"
  # The DMG window background is for the disk image, not the app.
  - "!router/assets/dmg-*"
  # Never required by the router profile (router/test/shell.test.js boots
  # createRouterCore and checks require.cache against this list).
  - "!node_modules/onnxruntime-node{,/**}"
  - "!node_modules/onnxruntime-web{,/**}"
  - "!node_modules/onnxruntime-common{,/**}"
  - "!node_modules/sherpa-onnx*{,/**}"
  - "!node_modules/kokoro-js{,/**}"
  - "!node_modules/@huggingface{,/**}"
  - "!node_modules/phonemizer{,/**}"
  - "!node_modules/@ricky0123{,/**}"
  - "!node_modules/playwright-core{,/**}"
  # sharp is only a dependency of @huggingface/transformers; leaving it out
  # also drops the only native binaries the package would carry.
  - "!node_modules/sharp{,/**}"
  - "!node_modules/@img{,/**}"

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: router/assets/icon.icns
  category: public.app-category.utilities
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: Koinos-Router-${version}-${arch}.${ext}
  # dist-router.js notarizes (and staples) itself, after its own signing.
  notarize: false
  extendInfo:
    LSUIElement: true

# The disk image: drag the app onto Applications. Icon x/y are centres, in
# points; they match DMG_LAYOUT in router/scripts/make-dmg-background.js,
# which draws the background (the @2x file next to it is picked up for Retina,
# and the window takes the 1x image's size, 540×380).
dmg:
  title: Koinos Router
  background: router/assets/dmg-background.png
  iconSize: 96
  iconTextSize: 12
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
  # No blockmap: there is no update feed, and a notarized dmg is stapled
  # after it is built, which would leave a blockmap stale.
  writeUpdateInfo: false

# Lock the packaged binary down. The main process holds the wallet password,
# the machine secret and the unlocked signer, and the Keychain trusts this
# binary: no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect/SIGUSR1 way to run
# other code inside it, and only the integrity-checked app.asar loads. The
# router profile spawns no Electron-as-Node child (see shell.test.js).
# resetAdHocDarwinSignature: flipping fuses breaks the arm64 ad-hoc signature;
# the stable identity dist-router.js signs with is applied after this.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  resetAdHocDarwinSignature: true

# No auto-update feed until Developer ID signing and notarization exist.
publish: null
